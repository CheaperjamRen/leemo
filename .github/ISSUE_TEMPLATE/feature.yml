name: Feature request
description: Propose a focused improvement to a real user workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to complete naturally today?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
      description: How do you handle it now, in Leemo or another product?
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result rather than an implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: A simple acceptance test
      description: What short journey would prove this is useful and working?

