<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leemo · 搭子模式</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg: #f7f3ec;
      --surface: #fffdfa;
      --surface-muted: #f1ece3;
      --surface-hover: #ebe3d7;
      --ink: #22211f;
      --ink-soft: #514e49;
      --muted: #817b72;
      --faint: #aaa39a;
      --line: #ded7cd;
      --line-strong: #cec5b8;
      --amber: #c77524;
      --amber-deep: #985316;
      --amber-soft: #f5dfc2;
      --amber-pale: #fff4e5;
      --red: #d84b42;
      --white: #ffffff;
      --shadow-color: rgba(67, 51, 32, 0.08);
      --shadow-hover: rgba(67, 51, 32, 0.12);
      --focus-ring: rgba(199, 117, 36, 0.2);
      --transparent: rgba(255, 255, 255, 0);
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    button, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: var(--transparent); }
    button:focus-visible, a:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .app {
      min-width: 1024px;
      height: 100vh;
      min-height: 720px;
      position: relative;
      isolation: isolate;
    }

    .app::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .22;
      background-image: linear-gradient(var(--transparent) 95%, var(--line) 100%);
      background-size: 100% 8px;
      mask-image: linear-gradient(to bottom, var(--white), var(--transparent) 42%);
      z-index: -1;
    }

    .topbar {
      height: 76px;
      padding: 0 30px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--transparent);
      border-radius: 50%;
      background: var(--transparent);
      color: var(--ink-soft);
      cursor: pointer;
      transition: background-color 180ms ease, border-color 180ms ease, transform 180ms ease;
    }

    .icon-button:hover {
      background: var(--surface);
      border-color: var(--line);
      transform: translateY(-1px);
    }

    .icon-button svg { width: 20px; height: 20px; }

    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 188px;
      height: 40px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-muted);
    }

    .mode-switch a {
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
    }

    .mode-switch a[aria-current="page"] {
      background: var(--surface);
      color: var(--amber-deep);
      box-shadow: 0 1px 4px var(--shadow-color);
    }

    .mode-switch a:not([aria-current="page"]):hover { color: var(--ink); }

    .topbar-end {
      justify-self: end;
      position: relative;
    }

    .unread-dot {
      position: absolute;
      top: 8px;
      right: 7px;
      width: 7px;
      height: 7px;
      border: 2px solid var(--bg);
      border-radius: 50%;
      background: var(--red);
    }

    main {
      width: min(720px, calc(100vw - 64px));
      height: calc(100vh - 76px);
      margin: 0 auto;
      padding: clamp(50px, 7vh, 72px) 0 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .momo-wrap {
      position: relative;
      width: 92px;
      height: 96px;
      display: grid;
      place-items: center;
      animation: breathe 5.8s ease-in-out infinite;
    }

    .momo-wrap::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 50px;
      height: 5px;
      border-radius: 50%;
      background: var(--shadow-color);
      filter: blur(3px);
      animation: shadow-breathe 5.8s ease-in-out infinite;
    }

    .momo-avatar {
      position: relative;
      z-index: 1;
      width: 82px;
      height: 82px;
      filter: drop-shadow(0 8px 10px var(--shadow-color));
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-5px) scale(1.018); }
    }

    @keyframes shadow-breathe {
      0%, 100% { transform: scaleX(1); opacity: .85; }
      50% { transform: scaleX(.82); opacity: .5; }
    }

    @media (prefers-reduced-motion: reduce) {
      .momo-wrap, .momo-wrap::after { animation: none; }
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }

    .greeting {
      max-width: 670px;
      margin: 27px 0 0;
      text-align: center;
      font-size: 22px;
      line-height: 1.65;
      font-weight: 540;
      color: var(--ink);
    }

    .greeting strong {
      font-weight: 660;
      color: var(--amber-deep);
      white-space: nowrap;
    }

    .artifact-card {
      width: 620px;
      min-height: 76px;
      margin-top: 24px;
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 46px 1fr auto;
      align-items: center;
      gap: 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 8px 28px var(--shadow-color);
      color: inherit;
      text-decoration: none;
      transition: border-color 200ms ease, box-shadow 200ms ease, transform 200ms ease;
    }

    .artifact-card:hover {
      border-color: var(--line-strong);
      box-shadow: 0 12px 34px var(--shadow-hover);
      transform: translateY(-2px);
    }

    .file-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--amber-pale);
      color: var(--amber-deep);
    }

    .file-mark svg { width: 23px; height: 23px; }

    .artifact-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 650;
      color: var(--ink);
    }

    .artifact-meta {
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .artifact-meta .tag {
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink-soft);
      background: var(--surface-muted);
    }

    .artifact-action {
      display: flex;
      align-items: center;
      gap: 7px;
      padding-left: 15px;
      color: var(--amber-deep);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .artifact-action svg { width: 16px; height: 16px; transition: transform 180ms ease; }
    .artifact-card:hover .artifact-action svg { transform: translateX(2px); }

    .composer-area {
      width: 680px;
      margin-top: auto;
    }

    .suggestions {
      margin: 0 0 12px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .suggestion {
      min-height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--transparent);
      color: var(--ink-soft);
      font-size: 13px;
      cursor: pointer;
      transition: border-color 160ms ease, background-color 160ms ease, color 160ms ease;
    }

    .suggestion:hover {
      border-color: var(--line-strong);
      background: var(--surface);
      color: var(--ink);
    }

    .composer {
      position: relative;
      min-height: 88px;
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 10px 32px var(--shadow-color);
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .composer:focus-within {
      border-color: var(--amber);
      box-shadow: 0 0 0 4px var(--focus-ring), 0 12px 32px var(--shadow-color);
    }

    .composer textarea {
      width: 100%;
      height: 86px;
      padding: 21px 74px 18px 22px;
      resize: none;
      border: 0;
      outline: 0;
      background: var(--transparent);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
    }

    .composer textarea::placeholder { color: var(--faint); opacity: 1; }

    .send-button {
      position: absolute;
      right: 14px;
      bottom: 14px;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 15px;
      background: var(--amber);
      color: var(--white);
      cursor: pointer;
      transition: background-color 160ms ease, transform 160ms ease;
    }

    .send-button:hover { background: var(--amber-deep); transform: translateY(-1px); }
    .send-button svg { width: 19px; height: 19px; }

    @media (max-height: 780px) {
      main { padding-top: 24px; padding-bottom: 20px; }
      .greeting { margin-top: 17px; font-size: 20px; }
      .artifact-card { margin-top: 16px; }
    }
  </style>
</head>
<body class="bg-[var(--bg)] text-[var(--ink)]">
  <div class="app">
    <header class="topbar" aria-label="顶部导航">
      <button class="icon-button" type="button" aria-label="打开历史记录">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 6.5h16M4 12h11M4 17.5h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>

      <nav class="mode-switch" aria-label="切换模式">
        <a href="buddy-mode.html" aria-current="page">搭子</a>
        <a href="workbench-mode.html">工作台</a>
      </nav>

      <div class="topbar-end">
        <button class="icon-button" type="button" aria-label="通知，1 条未读">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 8.5h18C21 16 18 16 18 9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M9.5 20a2.8 2.8 0 0 0 5 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <span class="unread-dot" aria-hidden="true"></span>
      </div>
    </header>

    <main>
      <div class="momo-wrap" aria-label="momo">
        <svg class="momo-avatar" viewBox="0 0 96 96" role="img" aria-label="momo 的折角便签头像">
          <path d="M24 10h38c5 0 8 1 11 4l11 11c2 2 3 5 3 9v34c0 11-8 19-19 19H26C15 87 8 79 8 68V28c0-10 7-18 16-18Z" fill="var(--amber-soft)"/>
          <path d="M64 11v13c0 5 3 8 8 8h14" fill="var(--surface)" stroke="var(--amber-deep)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M27 14h32c4 0 5 1 5 5v8c0 3 2 5 5 5h8c4 0 6 2 6 6v28c0 10-7 17-17 17H28c-10 0-16-7-16-17V30c0-10 6-16 15-16Z" fill="var(--amber)" opacity=".96"/>
          <rect x="22" y="29" width="52" height="40" rx="18" fill="var(--amber-pale)"/>
          <path d="M34 46v3M61 46v3" stroke="var(--ink)" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M39 57c5 4 13 4 18 0" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/>
          <circle cx="28" cy="56" r="3" fill="var(--amber-soft)"/>
          <circle cx="68" cy="56" r="3" fill="var(--amber-soft)"/>
          <path d="M70 14 83 27H73c-2 0-3-1-3-3V14Z" fill="var(--surface)"/>
          <path d="M18 74c7 8 15 11 29 11" fill="none" stroke="var(--amber-deep)" stroke-width="2" stroke-linecap="round" opacity=".45"/>
        </svg>
      </div>

      <p class="greeting">早呀。昨晚帮你把《数据结构》第五章的笔记整理完了，已经放进<strong>本子</strong>里。今天想从哪儿开始？</p>

      <a class="artifact-card" href="workbench-mode.html" aria-label="前往工作台查看第五章树与二叉树复习笔记">
        <span class="file-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7 3.5h7l4 4V20H7V3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M14 3.5v4h4M10 12h5M10 15.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>
          <span class="artifact-title">第五章 · 树与二叉树</span>
          <span class="artifact-meta"><span class="tag">复习笔记</span><span>数据结构本子</span></span>
        </span>
        <span class="artifact-action">去工作台查看
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="m7.5 4.5 5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </a>

      <section class="composer-area" aria-label="和 momo 对话">
        <div class="suggestions" aria-label="快捷开始">
          <button class="suggestion" type="button">帮我规划今天</button>
          <button class="suggestion" type="button">随便聊聊</button>
          <button class="suggestion" type="button">继续昨天的复习</button>
        </div>
        <div class="composer">
          <textarea aria-label="发消息给 momo" placeholder="跟 momo 说点什么…"></textarea>
          <button class="send-button" type="button" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 18V6M7 11l5-5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
